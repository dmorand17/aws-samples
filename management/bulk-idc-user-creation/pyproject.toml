[project]
name = "bulk-idc-user-creation"
version = "0.1.0"
description = "Bulk-create IAM Identity Center users from a CSV manifest"
readme = "README.md"
authors = [
    { name = "Doug Morand", email = "dmorand@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.68",
    "typer>=0.27.1",
]

[project.scripts]
create-idc-users = "create_idc_users:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["create_idc_users.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]
